name: Release & Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, 'podsync-manager') || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          ver = tag.lstrip("v")

          tags = subprocess.check_output(["git", "tag", "--sort=-v:refname"], text=True).splitlines()
          prev_tag = ""
          for i, t in enumerate(tags):
              if t == tag and i + 1 < len(tags):
                  prev_tag = tags[i + 1]
                  break

          body = ""
          if os.path.exists("CHANGELOG.md"):
              text = open("CHANGELOG.md", encoding="utf-8").read()
              pattern = rf"^## \[(?:v?{re.escape(ver)})\]\s*(?:-.*)?\n(.*?)(?=^## \[|\Z|^\[[^\]]+\]:\s*http)"
              m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if m:
                  body = m.group(1).strip()

          if body:
              if prev_tag:
                  body += f"\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}"
              with open("release_notes.md", "w", encoding="utf-8") as f:
                  f.write(body + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_notes=true\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_notes=false\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
