<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="100%" height="100%" style="background:#020617; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 브라우저 상단 프레임 -->
  <rect width="1440" height="980" fill="#020617" />
  <rect width="1440" height="42" fill="#0b0f19" border-bottom="1px solid #1e293b" />
  <line x1="0" y1="42" x2="1440" y2="42" stroke="#1e293b" stroke-width="1" />
  
  <!-- macOS 윈도우 버튼 -->
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />

  <!-- 브라우저 주소창 -->
  <rect x="420" y="8" width="600" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
  <path d="M440 21 a4 4 0 0 1 8 0 v2 h-8 z M442 21 v-1 a2 2 0 0 1 4 0 v1" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="440" y="20" width="8" height="6" rx="1" fill="#94a3b8"/>
  <text x="458" y="25" fill="#94a3b8" font-size="12" font-family="monospace">http://localhost:3000</text>

  <!-- 1. 상단 네비게이션 헤더 -->
  <rect y="43" width="1440" height="64" fill="#0f172a" opacity="0.95"/>
  <line x1="0" y1="107" x2="1440" y2="107" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(48, 59)">
    <!-- 로고 아이콘 -->
    <rect width="32" height="32" rx="8" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="3" fill="#818cf8"/>
    <path d="M11 11 A7 7 0 0 1 21 11 M8 8 A11 11 0 0 1 24 8" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- 로고 텍스트 -->
    <text x="42" y="22" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="-0.02em">Podsync Manager</text>

    <!-- 네비게이션 탭 -->
    <g transform="translate(240, 0)">
      <!-- 피드 (Active) -->
      <rect x="0" y="0" width="68" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="34" y="20" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">피드</text>

      <!-- 로그 -->
      <text x="110" y="20" fill="#94a3b8" font-size="13" font-weight="500">로그</text>

      <!-- 설정 -->
      <text x="175" y="20" fill="#94a3b8" font-size="13" font-weight="500">설정</text>
    </g>

    <!-- 우측 상태 및 액션 컨트롤 -->
    <g transform="translate(1010, 0)">
      <!-- 컨테이너 상태: Running -->
      <rect x="0" y="2" width="90" height="28" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.25"/>
      <circle cx="14" cy="16" r="3.5" fill="#10b981"/>
      <circle cx="14" cy="16" r="6" fill="#10b981" fill-opacity="0.25"/>
      <text x="26" y="20" fill="#34d399" font-size="12" font-weight="600">실행 중</text>

      <!-- 적용 / 재시작 버튼 -->
      <rect x="100" y="2" width="112" height="28" rx="8" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.3"/>
      <path d="M112 16 a4 4 0 1 1 2 3.5 l1 1.5 M114 21 h-4 v-4" fill="none" stroke="#a5b4fc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="126" y="20" fill="#c7d2fe" font-size="12" font-weight="600">적용 / 재시작</text>

      <!-- 언어 선택 드롭다운 (KO) -->
      <rect x="222" y="2" width="76" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="236" cy="16" r="6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <ellipse cx="236" cy="16" rx="2.5" ry="6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="230" y1="16" x2="242" y2="16" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="248" y="20" fill="#e2e8f0" font-size="12" font-weight="600">한국어</text>
      <path d="M288 15 l3 3 l3 -3" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/>

      <!-- 로그아웃 아이콘 -->
      <rect x="308" y="2" width="28" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <path d="M319 12 h4 a2 2 0 0 1 2 2 v4 a2 2 0 0 1 -2 2 h-4 M322 16 h-8 M317 13 l-3 3 l3 3" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 2. 대시보드 본문 영역 -->
  <g transform="translate(64, 135)">
    <!-- 상단 요약 위젯 2열 그리드 -->
    <!-- 위젯 1: 등록된 피드 -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="630" height="110" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="500">등록된 팟캐스트 피드</text>
      <text x="24" y="68" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="-0.03em">3개 피드 활성화</text>
      <text x="24" y="92" fill="#64748b" font-size="12">Podsync 백그라운드 서비스가 주기적으로 동기화 중입니다.</text>
      
      <!-- 우측 피드 아이콘 장식 -->
      <circle cx="575" cy="55" r="28" fill="#4f46e5" fill-opacity="0.1"/>
      <circle cx="575" cy="55" r="6" fill="#6366f1"/>
      <path d="M565 45 A14 14 0 0 1 585 45 M558 38 A24 24 0 0 1 592 38" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 위젯 2: S3 스토리지 사용량 (용량 계산) -->
    <g transform="translate(682, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="630" height="110" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="500">S3 호환 스토리지 사용량</text>
      
      <!-- 용량 계산 버튼 -->
      <rect x="520" y="16" width="86" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="563" y="33" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">용량 계산</text>

      <!-- 수치 및 퍼센트 -->
      <text x="24" y="62" fill="#94a3b8" font-size="12">사용 중: <tspan fill="#ffffff" font-weight="700">2.45 GB</tspan> (52개 파일)</text>
      <text x="606" y="62" fill="#818cf8" font-size="12" font-weight="600" text-anchor="end">24.5% / 10 GB</text>

      <!-- 프로그레스 바 -->
      <rect x="24" y="74" width="582" height="10" rx="5" fill="#1e293b"/>
      <rect x="24" y="74" width="142" height="10" rx="5" fill="url(#barGrad)"/>
    </g>

    <!-- 섹션 헤더 & 추가 버튼 바 -->
    <g transform="translate(0, 145)">
      <div>
        <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.02em">팟캐스트 피드 목록</text>
        <text x="0" y="46" fill="#94a3b8" font-size="13">YouTube 재생목록 및 채널을 자동 변환한 개인 전용 피드를 구독하고 관리합니다.</text>
      </div>

      <!-- 액션 버튼들 -->
      <g transform="translate(1010, 8)">
        <!-- OPML 열기 -->
        <rect x="0" y="0" width="86" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#cbd5e1" font-size="12" font-weight="600">OPML 열기</text>

        <!-- OPML 복사하기 -->
        <rect x="94" y="0" width="102" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="108" y="22" fill="#cbd5e1" font-size="12" font-weight="600">OPML 복사</text>

        <!-- 새 피드 추가 -->
        <rect x="204" y="0" width="96" height="36" rx="10" fill="#4f46e5"/>
        <text x="218" y="22" fill="#ffffff" font-size="15" font-weight="400">+</text>
        <text x="232" y="22" fill="#ffffff" font-size="12" font-weight="600">새 피드</text>
      </g>
    </g>

    <!-- 피드 카드 그리드 (2열 카드) -->
    <g transform="translate(0, 220)">
      <!-- 피드 카드 1 -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="644" height="240" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        
        <!-- 썸네일 (좌측) -->
        <g transform="translate(20, 20)">
          <rect width="140" height="140" rx="14" fill="url(#cardGrad1)" stroke="#312e81" stroke-width="1"/>
          <!-- 썸네일 그래픽 -->
          <circle cx="70" cy="70" r="28" fill="#4338ca"/>
          <path d="M60 70 a10 10 0 0 1 20 0 v8 a3 3 0 0 1 -6 0 v-8 a4 4 0 0 0 -8 0 v8 a3 3 0 0 1 -6 0 z" fill="#ffffff"/>
          <path d="M52 70 A18 18 0 0 0 88 70 M70 88 v10 M62 98 h16" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- 카드 본문 정보 (우측) -->
        <g transform="translate(180, 24)">
          <!-- 태그 배지들 -->
          <rect x="0" y="0" width="94" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="47" y="14" fill="#a5b4fc" font-size="10" font-family="monospace" font-weight="600" text-anchor="middle">ID: tech_radar</text>

          <rect x="100" y="0" width="70" height="20" rx="4" fill="#1e293b"/>
          <text x="135" y="14" fill="#cbd5e1" font-size="10" font-weight="500" text-anchor="middle">오디오 · low</text>

          <rect x="176" y="0" width="80" height="20" rx="4" fill="#1e293b"/>
          <text x="216" y="14" fill="#94a3b8" font-size="10" text-anchor="middle">최근 5개 보관</text>

          <!-- 동기화 남은 시간 배지 (다국어 처리 확인) -->
          <rect x="262" y="0" width="180" height="20" rx="10" fill="#312e81" fill-opacity="0.4" stroke="#4f46e5" stroke-opacity="0.5"/>
          <circle cx="272" cy="10" r="2.5" fill="#818cf8"/>
          <text x="282" y="14" fill="#c7d2fe" font-size="10" font-weight="500">다음 동기화: <tspan fill="#ffffff" font-weight="700">약 11분 남음</tspan> (01:15)</text>

          <!-- 피드 제목 -->
          <text x="0" y="52" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.02em">Tech Radar Weekly Podcast</text>

          <!-- 피드 설명 -->
          <text x="0" y="76" fill="#94a3b8" font-size="12" line-height="18">
            최신 글로벌 오픈소스 기술 트렌드와 개발자 컨퍼런스 세션을 광고 없이
          </text>
          <text x="0" y="94" fill="#94a3b8" font-size="12">
            고음질 단일 스트림 오디오로 자동 수집 및 동기화합니다.
          </text>

          <!-- 유튜브 원본 링크 -->
          <g transform="translate(0, 114)">
            <rect width="138" height="24" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.25"/>
            <rect x="8" y="7" width="12" height="10" rx="2" fill="#f87171"/>
            <polygon points="12,9 12,15 17,12" fill="#0f172a"/>
            <text x="26" y="17" fill="#fca5a5" font-size="11" font-weight="500">YouTube 소스 열기</text>
          </g>
        </g>

          <!-- RSS 열기 / 복사하기 버튼 (상단 우측) -->
          <g transform="translate(320, 114)">
            <rect x="0" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
            <text x="31" y="16" fill="#cbd5e1" font-size="10" font-weight="500" text-anchor="middle">RSS 열기</text>

            <rect x="68" y="0" width="56" height="24" rx="6" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.4"/>
            <text x="96" y="16" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">RSS 복사</text>
          </g>

          <!-- 상세 보기 -->
          <rect x="420" y="0" width="60" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="450" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">에피소드</text>

          <!-- 복제 -->
          <rect x="488" y="0" width="46" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="511" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">복제</text>

          <!-- 수정 -->
          <rect x="542" y="0" width="46" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="565" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">수정</text>
        </g>
      </g>

      <!-- 피드 카드 2 -->
      <g transform="translate(668, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="644" height="240" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        
        <!-- 썸네일 (좌측) -->
        <g transform="translate(20, 20)">
          <rect width="140" height="140" rx="14" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1"/>
          <!-- 썸네일 그래픽 -->
          <circle cx="70" cy="70" r="28" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
          <polygon points="64,58 64,82 82,70" fill="#6366f1"/>
        </g>

        <!-- 카드 본문 정보 (우측) -->
        <g transform="translate(180, 24)">
          <!-- 태그 배지들 -->
          <rect x="0" y="0" width="102" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="51" y="14" fill="#a5b4fc" font-size="10" font-family="monospace" font-weight="600" text-anchor="middle">ID: daily_brief</text>

          <rect x="108" y="0" width="70" height="20" rx="4" fill="#1e293b"/>
          <text x="143" y="14" fill="#cbd5e1" font-size="10" font-weight="500" text-anchor="middle">오디오 · low</text>

          <rect x="184" y="0" width="80" height="20" rx="4" fill="#1e293b"/>
          <text x="224" y="14" fill="#94a3b8" font-size="10" text-anchor="middle">최근 3개 보관</text>

          <!-- 동기화 남은 시간 배지 -->
          <rect x="270" y="0" width="170" height="20" rx="10" fill="#312e81" fill-opacity="0.4" stroke="#4f46e5" stroke-opacity="0.5"/>
          <circle cx="280" cy="10" r="2.5" fill="#818cf8"/>
          <text x="290" y="14" fill="#c7d2fe" font-size="10" font-weight="500">다음 동기화: <tspan fill="#ffffff" font-weight="700">약 3분 남음</tspan> (01:07)</text>

          <!-- 피드 제목 -->
          <text x="0" y="52" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.02em">Daily Global Briefing</text>

          <!-- 피드 설명 -->
          <text x="0" y="76" fill="#94a3b8" font-size="12">
            국내외 주요 경제 시사 브리핑 및 심층 해설 채널의 라이브 방송을
          </text>
          <text x="0" y="94" fill="#94a3b8" font-size="12">
            제외하고 정규 에피소드만 팟캐스트 구독용 RSS로 제공합니다.
          </text>

          <!-- 유튜브 원본 링크 -->
          <g transform="translate(0, 114)">
            <rect width="138" height="24" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.25"/>
            <rect x="8" y="7" width="12" height="10" rx="2" fill="#f87171"/>
            <polygon points="12,9 12,15 17,12" fill="#0f172a"/>
            <text x="26" y="17" fill="#fca5a5" font-size="11" font-weight="500">YouTube 소스 열기</text>
          </g>
        </g>

          <!-- RSS 열기 / 복사하기 버튼 (상단 우측) -->
          <g transform="translate(320, 114)">
            <rect x="0" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
            <text x="31" y="16" fill="#cbd5e1" font-size="10" font-weight="500" text-anchor="middle">RSS 열기</text>

            <rect x="68" y="0" width="56" height="24" rx="6" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.4"/>
            <text x="96" y="16" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">RSS 복사</text>
          </g>

          <!-- 상세 보기 -->
          <rect x="420" y="0" width="60" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="450" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">에피소드</text>

          <!-- 복제 -->
          <rect x="488" y="0" width="46" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="511" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">복제</text>

          <!-- 수정 -->
          <rect x="542" y="0" width="46" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="565" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">수정</text>
        </g>
      </g>
    </g>
  </g>
</svg>
