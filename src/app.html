<!doctype html>
<html lang="ko" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('podsync_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <title>Podsync Manager</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="h-full antialiased font-sans">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
